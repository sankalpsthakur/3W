# CI for benchmarks/held_out_well. Lives on the CI branch only.
name: held-out-well CI

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !**/*.parquet
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv
        run: uv venv .venv

      - name: Install CPU torch first (the toolkit pins only a minimum)
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the toolkit with dev extras
        run: uv pip install -e '.[dev]'

      - name: Versions
        run: |
          source .venv/bin/activate
          python --version
          ruff --version
          mypy --version
          pip list 2>/dev/null | grep -i -E "numpy|pandas|scikit|pydantic|torch|pyarrow|pytest" || true

      - name: Licences of the dependencies, from installed metadata
        if: matrix.python-version == '3.12'
        run: |
          source .venv/bin/activate
          uv pip install lightgbm
          python - <<'PY'
          from importlib.metadata import metadata
          for p in ["numpy", "pandas", "scikit-learn", "pyarrow", "pydantic", "torch", "lightgbm"]:
              m = metadata(p)
              lic = (m.get("License-Expression") or m.get("License") or "").replace("\n", " ")[:90]
              cls = [c for c in (m.get_all("Classifier") or []) if c.startswith("License")]
              print("LICENCE", p, m["Version"], "|", lic, "|", cls)
          PY

      - name: ruff format --check
        if: always()
        run: |
          source .venv/bin/activate
          ruff format --check benchmarks/held_out_well

      - name: ruff check
        if: always()
        run: |
          source .venv/bin/activate
          ruff check benchmarks/held_out_well

      - name: ruff W505 (comments and docstrings up to 72 columns)
        if: always()
        run: |
          source .venv/bin/activate
          ruff check --select W505 --output-format concise --config 'lint.pycodestyle.max-doc-length = 72' benchmarks/held_out_well

      - name: mypy
        if: always()
        run: |
          source .venv/bin/activate
          mypy benchmarks/held_out_well

      - name: pytest
        if: always()
        run: |
          source .venv/bin/activate
          python -m pytest -q -p no:cacheprovider benchmarks/held_out_well

      - name: README commands, run from the folder
        if: always()
        run: |
          source .venv/bin/activate
          cd benchmarks/held_out_well
          python -m pytest -q -p no:cacheprovider
          python -m held_out_well manifest --check

      - name: Formatter diff (what ruff format would change)
        if: always()
        run: |
          source .venv/bin/activate
          ruff format benchmarks/held_out_well || true
          git diff --stat > format.stat || true
          git diff > format.diff || true
          cat format.stat

      - name: Upload formatter diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-diff-py${{ matrix.python-version }}
          path: |
            format.diff
            format.stat
            benchmarks/held_out_well

      - name: Link check (lychee) on this folder, as bin/lint does locally
        if: always() && matrix.python-version == '3.12'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress 'benchmarks/held_out_well/**/*.md'
          fail: true
